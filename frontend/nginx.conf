server {
    listen 80;
    server_name localhost;

    # Раздаем статику (ваш index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Перенаправляем запросы /submit на бэкенд
    location /submit {
        proxy_pass http://backend:5000;
    }

    # Перенаправляем запросы /read на бэкенд
    location /read {
        proxy_pass http://backend:5000;
    }
}