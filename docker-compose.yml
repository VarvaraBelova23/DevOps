services:
  backend:
    build: ./backend
    image: my-backend:2.0
    container_name: backend-container
    volumes:
      - ./backend/data.txt:/app/data.txt
    networks:
      - devops-network
    restart: always

  frontend:
    build: ./frontend
    image: my-frontend:2.0
    container_name: frontend-container
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - devops-network
    restart: always

networks:
  devops-network:
    driver: bridge