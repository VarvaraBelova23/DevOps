<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Frontend 2.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px 0;
        }
        input {
            width: 65%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #readBtn {
            background-color: #2196F3;
        }
        #readBtn:hover {
            background-color: #0b7dda;
        }
        .block {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ccc;
        }
        #status, #fileContent {
            margin-top: 15px;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
            font-size: 14px;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>Frontend 2.0</h1>

    <div class="block">
        <h2>Отправка данных</h2>
        <input type="text" id="textInput" placeholder="Введите текст...">
        <button id="submitBtn">Отправить</button>
        <p id="status"></p>
    </div>

    <div class="block">
        <h2>Чтение данных из файла</h2>
        <input type="text" id="readInput" placeholder="Нажмите «Прочитать», чтобы получить содержимое data.txt" readonly>
        <button id="readBtn">Прочитать</button>
        <p>Содержимое data.txt:</p>
        <textarea id="fileContent" readonly></textarea>
    </div>

    <script>
        const SUBMIT_URL = '/submit';
        const READ_URL = '/read';

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const text = document.getElementById('textInput').value;
            const statusEl = document.getElementById('status');

            if (!text) {
                statusEl.textContent = 'Введите текст!';
                return;
            }

            try {
                const response = await fetch(SUBMIT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                statusEl.textContent = 'Ответ сервера: ' + JSON.stringify(data);
            } catch (error) {
                statusEl.textContent = 'Ошибка: ' + error.message;
            }
        });

        document.getElementById('readBtn').addEventListener('click', async () => {
            const readInput = document.getElementById('readInput');
            const fileContentEl = document.getElementById('fileContent');

            try {
                const response = await fetch(READ_URL, {
                    method: 'GET'
                });

                const data = await response.json();

                if (data.status === 'ok') {
                    readInput.value = 'Данные успешно получены';
                    fileContentEl.value = data.content || '(файл пуст)';
                } else {
                    readInput.value = 'Ошибка при чтении';
                    fileContentEl.value = '';
                }
            } catch (error) {
                readInput.value = 'Ошибка: ' + error.message;
                fileContentEl.value = '';
            }
        });
    </script>
</body>
</html>
