---
- name: 1. Установка зависимостей для Docker
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
    state: present
    update_cache: yes

- name: 2. Установка Docker
  apt:
    name: docker.io
    state: present

- name: 3. Установка Docker Compose
  apt:
    name: docker-compose
    state: present

- name: 4. Добавление пользователя в группу docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: 6. Запуск контейнеров через Docker Compose
  command: docker-compose up -d --build
  args:
    chdir: /var/jenkins_home/workspace/DevOps-Deploy
  tags:
    - deploy
    - up

- name: 7. Остановка контейнеров через Docker Compose
  command: docker-compose down
  args:
    chdir: /var/jenkins_home/workspace/DevOps-Deploy
  tags:
    - stop
    - down
